<!-- app_Petco/templates/producto/actualizar_producto.html -->
{% extends 'base.html' %}

{% block titulo %}Actualizar Producto - Petco Full System{% endblock %}

{% block contenido %}
    <h1 class="mb-4 text-primary">Actualizar Producto: {{ producto.nombre_producto }}</h1>

    <form method="post" action="{% url 'actualizar_producto' producto.producto_id %}" class="bg-white p-4 rounded shadow-sm">
        {% csrf_token %}
        <div class="mb-3">
            <label for="nombre_producto" class="form-label">Nombre del Producto</label>
            <input type="text" class="form-control" id="nombre_producto" name="nombre_producto" value="{{ producto.nombre_producto }}" required>
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción (Opcional)</label>
            <textarea class="form-control" id="descripcion" name="descripcion" rows="3">{{ producto.descripcion|default_if_none:"" }}</textarea>
        </div>
        <div class="mb-3">
            <label for="categoria" class="form-label">Categoría</label>
            <select class="form-select" id="categoria" name="categoria" required>
                <option value="">Selecciona una categoría</option>
                {% for cat in categorias %}
                    <option value="{{ cat }}" {% if cat == producto.categoria %}selected{% endif %}>
                        {{ cat }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="precio" class="form-label">Precio</label>
            <input type="number" step="0.01" class="form-control" id="precio" name="precio" value="{{ producto.precio }}" required>
        </div>
        <div class="mb-3">
            <label for="stock" class="form-label">Stock</label>
            <input type="number" class="form-control" id="stock" name="stock" value="{{ producto.stock }}" required>
        </div>
        <button type="submit" class="btn btn-primary me-2">Guardar Cambios</button>
        <a href="{% url 'ver_productos' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
