<!-- app_Petco/templates/veterinario/actualizar_veterinario.html -->
{% extends 'base.html' %}

{% block titulo %}Actualizar Veterinario - Petco Full System{% endblock %}

{% block contenido %}
    <h1 class="mb-4 text-primary">Actualizar Veterinario: {{ veterinario.nombre }} {{ veterinario.apellido }}</h1>

    <form method="post" action="{% url 'actualizar_veterinario' veterinario.veterinario_id %}" class="bg-white p-4 rounded shadow-sm">
        {% csrf_token %}
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" name="nombre" value="{{ veterinario.nombre }}" required>
        </div>
        <div class="mb-3">
            <label for="apellido" class="form-label">Apellido</label>
            <input type="text" class="form-control" id="apellido" name="apellido" value="{{ veterinario.apellido }}" required>
        </div>
        <div class="mb-3">
            <label for="licencia" class="form-label">Número de Licencia</label>
            <input type="text" class="form-control" id="licencia" name="licencia" value="{{ veterinario.licencia }}" required>
        </div>
        <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono (Opcional)</label>
            <input type="text" class="form-control" id="telefono" name="telefono" value="{{ veterinario.telefono|default_if_none:"" }}">
        </div>
        <div class="mb-3">
            <label for="especialidad" class="form-label">Especialidad (Opcional)</label>
            <select class="form-select" id="especialidad" name="especialidad">
                <option value="">Selecciona una especialidad</option>
                {% for esp in especialidades %}
                    <option value="{{ esp }}" {% if esp == veterinario.especialidad %}selected{% endif %}>
                        {{ esp }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary me-2">Guardar Cambios</button>
        <a href="{% url 'ver_veterinarios' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
