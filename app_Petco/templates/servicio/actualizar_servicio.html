<!-- app_Petco/templates/servicio/actualizar_servicio.html -->
{% extends 'base.html' %}

{% block titulo %}Actualizar Servicio - Petco Full System{% endblock %}

{% block contenido %}
    <h1 class="mb-4 text-primary">Actualizar Servicio: {{ servicio.nombre_servicio }}</h1>

    <form method="post" action="{% url 'actualizar_servicio' servicio.servicio_id %}" class="bg-white p-4 rounded shadow-sm">
        {% csrf_token %}
        <div class="mb-3">
            <label for="nombre_servicio" class="form-label">Nombre del Servicio</label>
            <input type="text" class="form-control" id="nombre_servicio" name="nombre_servicio" value="{{ servicio.nombre_servicio }}" required>
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción (Opcional)</label>
            <textarea class="form-control" id="descripcion" name="descripcion" rows="3">{{ servicio.descripcion|default_if_none:"" }}</textarea>
        </div>
        <div class="mb-3">
            <label for="duracion_min" class="form-label">Duración (minutos)</label>
            <input type="number" class="form-control" id="duracion_min" name="duracion_min" value="{{ servicio.duracion_min }}" required>
        </div>
        <div class="mb-3">
            <label for="precio" class="form-label">Precio</label>
            <input type="number" step="0.01" class="form-control" id="precio" name="precio" value="{{ servicio.precio }}" required>
        </div>
        <div class="mb-3">
            <label for="categoria" class="form-label">Categoría</label>
            <select class="form-select" id="categoria" name="categoria" required>
                <option value="">Selecciona una categoría</option>
                {% for cat in categorias %}
                    <option value="{{ cat }}" {% if cat == servicio.categoria %}selected{% endif %}>
                        {{ cat }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary me-2">Guardar Cambios</button>
        <a href="{% url 'ver_servicios' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
