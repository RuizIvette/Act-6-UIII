<!-- app_Petco/templates/servicio/agregar_servicio.html -->
{% extends 'base.html' %}

{% block titulo %}Agregar Servicio - Petco Full System{% endblock %}

{% block contenido %}
    <h1 class="mb-4 text-primary">Agregar Nuevo Servicio</h1>

    {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
    {% endif %}

    <form method="post" action="{% url 'agregar_servicio' %}" class="bg-white p-4 rounded shadow-sm">
        {% csrf_token %}
        <div class="mb-3">
            <label for="nombre_servicio" class="form-label">Nombre del Servicio</label>
            <input type="text" class="form-control" id="nombre_servicio" name="nombre_servicio" required>
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción (Opcional)</label>
            <textarea class="form-control" id="descripcion" name="descripcion" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label for="duracion_min" class="form-label">Duración (minutos)</label>
            <input type="number" class="form-control" id="duracion_min" name="duracion_min" required value="30">
        </div>
        <div class="mb-3">
            <label for="precio" class="form-label">Precio</label>
            <input type="number" step="0.01" class="form-control" id="precio" name="precio" required>
        </div>
        <div class="mb-3">
            <label for="categoria" class="form-label">Categoría</label>
            <select class="form-select" id="categoria" name="categoria" required>
                <option value="">Selecciona una categoría</option>
                {% for cat in categorias %}
                    <option value="{{ cat }}">{{ cat }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary me-2">Guardar Servicio</button>
        <a href="{% url 'ver_servicios' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
